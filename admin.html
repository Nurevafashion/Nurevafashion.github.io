<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Nureva Fashion</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=29">
<link rel="stylesheet" href="admin.css?v=29">
</head>
<body class="admin-body">

<div class="login-screen">
  <form class="login-box" id="loginForm">
    <div class="foot-logo" style="color:var(--admin-pink-dark);margin-bottom:6px">Nureva <span>Fashion</span></div>
    <p style="color:#8A5875;margin-bottom:22px">Sign in to the admin panel</p>
    <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required autofocus></div>
    <button class="btn btn-primary btn-block" type="submit">Sign In</button>
    <p id="loginError" style="color:#C0143C;margin-top:12px;display:none"></p>
    <p style="margin-top:18px;font-size:0.8rem;color:#8A5875">First time here? Create the admin user in Firebase Authentication — see README.md for the exact steps.</p>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=29"></script>
<script src="store.js?v=29"></script>
<script src="admin.js?v=29"></script>
</body>
</html>
