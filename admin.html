<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Nureva Fashion</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=40">
<link rel="stylesheet" href="admin.css?v=40">
</head>
<body class="admin-body">

<div class="login-screen">
  <form class="login-box" id="loginForm">
    <div class="foot-logo" style="color:var(--admin-pink-dark);margin-bottom:6px">Nureva <span>Fashion</span></div>
    <p style="color:#8A5875;margin-bottom:22px">Sign in to the admin panel</p>
    <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required autofocus></div>
    <button class="btn btn-primary btn-block" type="submit">Sign In</button>
    <p id="loginError" style="color:#C0143C;margin-top:12px;display:none"></p>
    <p style="margin-top:18px;font-size:0.8rem;color:#8A5875">First time here? Create the admin user in Firebase Authentication — see README.md for the exact steps.</p>
  </form>
</div>

<script>
  /* Self-healing: mobile networks sometimes drop one of these CDN/script
     requests mid-load. If that happens NurevaStore never gets created and
     everything relying on it (Call/WhatsApp, products, etc.) silently
     fails. Auto-reload once (only once, via sessionStorage guard) so a
     transient network blip fixes itself instead of leaving a broken page. */
  function nurevaRetryLoad() {
    var key = "nurevaReloadCount";
    var n = parseInt(sessionStorage.getItem(key) || "0", 10);
    if (n < 2) { sessionStorage.setItem(key, String(n + 1)); location.reload(); }
  }
</script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="firebase-config.js?v=40" onerror="nurevaRetryLoad()"></script>
<script src="store.js?v=40" onerror="nurevaRetryLoad()"></script>
<script src="admin.js?v=40"></script>
</body>
</html>
