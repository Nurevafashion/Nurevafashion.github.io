<head>

<body class="admin-body">

<div class="admin-app">
  <div class="admin-sidebar-overlay" id="adminSidebarOverlay"></div>
  <aside class="admin-sidebar">
    <button class="admin-sidebar-close" id="adminSidebarClose">✕</button>
    <div class="admin-logo">Nureva <span>Fashion</span><small>Admin Panel</small></div>
    <nav class="admin-nav">
      <a href="admin-dashboard.html">📊 Dashboard</a>
      <a href="admin-products.html">👗 Products</a>
      <a href="admin-banners.html">🖼️ Covers</a>
      <a href="admin-news.html">📢 News / Notice</a>
      <a href="admin-orders.html">📦 Orders</a>
      <a href="admin-users.html">👤 Account Users</a>
      <a href="admin-chat.html">💬 Live Chat<span class="nav-badge" id="navChatBadge">0</span></a>
      <a href="admin-settings.html">⚙️ Settings</a>
    </nav>
    <a href="index.html" target="_blank" class="admin-view-site">🔗 View Site</a>
    <button id="logoutBtn" class="admin-logout">🚪 Logout</button>
  </aside>

  <main class="admin-main">
    <button class="admin-mobile-toggle" id="adminMobileToggle">☰ Menu</button>
    <section class="admin-panel">
      <h2>News / Notices (shown in the homepage ticker)</h2>
      <form id="newsForm" class="admin-inline-form">
        <input type="text" id="newsInput" placeholder="Write a new notice... e.g. Eid Offer is live!" required>
        <button class="btn btn-primary" type="submit">Add</button>
      </form>
      <div id="newsList" class="admin-list"></div>
    </section>
  </main>
</div>

<script>
  /* Self-healing: mobile networks sometimes drop one of these CDN/script
     requests mid-load. If that happens NurevaStore never gets created and
     everything relying on it (Call/WhatsApp, products, etc.) silently
     fails. Auto-reload once (only once, via sessionStorage guard) so a
     transient network blip fixes itself instead of leaving a broken page. */
  function nurevaRetryLoad() {
    var key = "nurevaReloadCount";
    var n = parseInt(sessionStorage.getItem(key) || "0", 10);
    if (n < 2) { sessionStorage.setItem(key, String(n + 1)); location.reload(); }
  }
</script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="firebase-config.js?v=44" onerror="nurevaRetryLoad()"></script>
<script src="store.js?v=44" onerror="nurevaRetryLoad()"></script>
<script src="admin.js?v=44"></script>
</body>
</html>
