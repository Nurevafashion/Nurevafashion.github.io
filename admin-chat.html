<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Chat — Nureva Fashion Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=36">
<link rel="stylesheet" href="admin.css?v=36">
</head>
<body class="admin-body">

<div class="admin-app">
  <div class="admin-sidebar-overlay" id="adminSidebarOverlay"></div>
  <aside class="admin-sidebar">
    <button class="admin-sidebar-close" id="adminSidebarClose">✕</button>
    <div class="admin-logo">Nureva <span>Fashion</span><small>Admin Panel</small></div>
    <nav class="admin-nav">
      <a href="admin-dashboard.html">📊 Dashboard</a>
      <a href="admin-products.html">👗 Products</a>
      <a href="admin-banners.html">🖼️ Covers</a>
      <a href="admin-news.html">📢 News / Notice</a>
      <a href="admin-orders.html">📦 Orders</a>
      <a href="admin-chat.html">💬 Live Chat<span class="nav-badge" id="navChatBadge">0</span></a>
      <a href="admin-settings.html">⚙️ Settings</a>
    </nav>
    <a href="index.html" target="_blank" class="admin-view-site">🔗 View Site</a>
    <button id="logoutBtn" class="admin-logout">🚪 Logout</button>
  </aside>

  <main class="admin-main">
    <button class="admin-mobile-toggle" id="adminMobileToggle">☰ Menu</button>
    <section class="admin-panel">
      <div class="chat-page-head-row">
        <h2>💬 Live Chat</h2>
        <span class="chat-newmsg-badge" id="chatNewMsgBadge" style="display:none">🔔 0 New Messages</span>
      </div>
      <div class="chat-admin-layout">
        <div class="chat-customer-list">
          <div class="chat-list-head">
            <span>👤 Customers</span>
            <span class="chat-total-badge" id="chatTotalBadge" style="display:none">0</span>
          </div>
          <div id="chatCustomers"></div>
        </div>
        <div class="chat-conversation">
          <div class="chat-conv-empty" id="chatConvEmpty">Select a customer to view the conversation</div>
          <div class="chat-conv-active" id="chatConvActive" style="display:none">
            <div class="chat-conv-head">
              <button type="button" class="chat-back-btn" id="chatBackBtn" aria-label="Back">←</button>
              <div class="chat-conv-info">
                <div class="chat-conv-name" id="chatConvName"></div>
                <div class="chat-conv-status" id="chatConvStatus"></div>
              </div>
              <button type="button" class="chat-delete-btn" id="chatDeleteBtn">🗑️ Delete</button>
            </div>
            <div class="chat-conv-messages" id="chatConvMessages"></div>
            <form class="chat-conv-reply" id="chatReplyForm">
              <textarea id="chatReplyInput" placeholder="Type your reply..." required></textarea>
              <button class="btn btn-primary" type="submit">✍️ Send</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
  /* Self-healing: mobile networks sometimes drop one of these CDN/script
     requests mid-load. If that happens NurevaStore never gets created and
     everything relying on it (Call/WhatsApp, products, etc.) silently
     fails. Auto-reload once (only once, via sessionStorage guard) so a
     transient network blip fixes itself instead of leaving a broken page. */
  function nurevaRetryLoad() {
    var key = "nurevaReloadCount";
    var n = parseInt(sessionStorage.getItem(key) || "0", 10);
    if (n < 2) { sessionStorage.setItem(key, String(n + 1)); location.reload(); }
  }
</script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="firebase-config.js?v=36" onerror="nurevaRetryLoad()"></script>
<script src="store.js?v=36" onerror="nurevaRetryLoad()"></script>
<script src="admin.js?v=36"></script>
</body>
</html>
