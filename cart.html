<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — Nureva Fashion</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=15">
<style>
  .cart-row { background:var(--white); border:1px solid rgba(0,0,0,0.08); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); margin-bottom:14px; }
  .cart-row-top { display:flex; gap:14px; align-items:flex-start; }
  .cart-row img { width:76px; height:92px; object-fit:cover; border-radius:4px; cursor:zoom-in; flex-shrink:0; border:1px solid rgba(0,0,0,0.08); }
  .cart-row .info { flex:1; min-width:0; }
  .cart-row .meta { font-size:0.82rem; color:var(--mauve); margin-top:2px; }
  .cart-row .remove {
    margin-top:12px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    background:#FFFFFF; border:1.5px solid var(--danger); color:var(--danger); font-size:0.88rem; font-weight:600;
    padding:10px; border-radius:var(--radius);
  }
  .cart-row .remove:hover, .cart-row .remove:active { background:var(--danger); color:#fff; }
  .cart-row .remove svg { width:16px; height:16px; }
  .cart-summary { background:var(--white); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
  .cart-summary .row { display:flex; justify-content:space-between; margin-bottom:10px; }
  .cart-summary .total { font-weight:700; font-size:1.15rem; color:var(--primary); border-top:1px dashed var(--gold); padding-top:12px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner container">
    <a href="index.html" class="logo"><img src="logo.png" alt="Nureva Fashion" class="logo-img"><span class="logo-text">Nureva <span>Fashion</span></span></a>
    <nav class="main-nav">
          <a href="products.html">All Products</a>
      <a href="offers.html">Offers</a>
      <a href="track-order.html">My Orders</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn icon-btn-round" id="searchToggle" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
</header>
<div class="drawer-overlay" id="drawerOverlay"></div>
<nav class="nav-drawer" id="navDrawer">
  <button class="drawer-close" id="drawerClose">✕</button>
  <a href="products.html">All Products</a>
  <a href="offers.html">Offers</a>
  <a href="track-order.html">My Orders</a>
      <a href="contact.html">Contact</a>
</nav>

<div class="page-hero"><div class="container"><h1>Your Cart</h1></div></div>

<div class="container" style="padding:36px 20px">
  <div style="display:grid;grid-template-columns:2fr 1fr;gap:30px" id="cartLayout">
    <div id="cartList"></div>
    <div class="cart-summary">
      <div class="row"><span>Subtotal</span><span id="subtotal">৳0</span></div>
      <div class="row"><span>Delivery Fee</span><span id="deliveryFee">Calculated at checkout</span></div>
      <div class="row total"><span>Total</span><span id="grandTotal">৳0</span></div>
      <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:16px">Proceed to Checkout</a>
      <a href="products.html" class="btn btn-outline btn-block" style="margin-top:10px;border-color:var(--primary);color:var(--primary)">Continue Shopping</a>
    </div>
  </div>
</div>

<div class="topbar">Cash on Delivery Nationwide &nbsp;•&nbsp; Order via Facebook or our website</div>

<footer id="siteFooter"></footer>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=15"></script>
<script src="store.js?v=15"></script>
<script src="site.js?v=15"></script>
<script>
  function renderCart() {
    const cart = getCart();
    const listEl = document.getElementById("cartList");
    if (!cart.length) {
      listEl.innerHTML = `<div class="empty-state"><h3>Your cart is empty</h3><p>Add products to start shopping</p><a href="products.html" class="btn btn-primary" style="margin-top:14px">Browse Products</a></div>`;
      document.getElementById("subtotal").textContent = document.getElementById("grandTotal").textContent = formatTaka(0);
      return;
    }
    listEl.innerHTML = cart.map((c, i) => `
      <div class="cart-row">
        <div class="cart-row-top">
          <img src="${c.image}" alt="${c.name}" class="cart-img" data-i="${i}">
          <div class="info">
            <div style="font-weight:600">${c.name}</div>
            <div class="meta">Size: ${c.size} · Colour: ${c.color} · Qty: ${c.qty}</div>
            <div style="color:var(--primary);font-weight:700;margin-top:4px">${formatTaka(c.price * c.qty)}</div>
          </div>
        </div>
        <button class="remove" data-i="${i}" aria-label="Remove">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          Remove
        </button>
      </div>
    `).join("");
    document.querySelectorAll(".cart-img").forEach(img => img.addEventListener("click", () => openLightbox(img.src)));
    document.querySelectorAll(".remove").forEach(b => b.addEventListener("click", () => {
      const c = getCart(); c.splice(Number(b.dataset.i), 1); saveCart(c); renderCart();
    }));
    const subtotal = cart.reduce((s, c) => s + c.price * c.qty, 0);
    document.getElementById("subtotal").textContent = formatTaka(subtotal);
    document.getElementById("grandTotal").textContent = formatTaka(subtotal);
  }
  NurevaStore.ready.then(() => { applySettings(); renderFooter(); renderCart(); });
</script>
</body>
</html>
