<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart — Nureva Fashion</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<style>
  .cart-row { display:flex; gap:16px; align-items:center; background:var(--white); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); margin-bottom:14px; }
  .cart-row img { width:64px; height:78px; object-fit:cover; border-radius:3px; }
  .cart-row .info { flex:1; }
  .cart-row .meta { font-size:0.82rem; color:var(--mauve); }
  .cart-row .remove { background:none; border:none; color:var(--danger); font-size:1.2rem; }
  .cart-summary { background:var(--white); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
  .cart-summary .row { display:flex; justify-content:space-between; margin-bottom:10px; }
  .cart-summary .total { font-weight:700; font-size:1.15rem; color:var(--primary); border-top:1px dashed var(--gold); padding-top:12px; }
</style>
</head>
<body>

<div class="topbar">Cash on Delivery Nationwide &nbsp;•&nbsp; Order via Facebook or our website</div>
<header class="site-header">
  <div class="header-inner container">
    <a href="index.html" class="logo">Nureva <span>Fashion</span></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">All Products</a>
      <a href="offers.html">Offers</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <a class="icon-btn" href="cart.html" style="position:relative"><span id="cartCount" style="display:none;position:absolute;top:-2px;right:-2px;background:var(--gold);color:var(--primary);border-radius:50%;width:17px;height:17px;font-size:0.65rem;align-items:center;justify-content:center;font-weight:700;">0</span>🛍️</a>
      <button class="menu-toggle" id="menuToggle">☰</button>
    </div>
  </div>
</header>
<div class="drawer-overlay" id="drawerOverlay"></div>
<nav class="nav-drawer" id="navDrawer">
  <button class="drawer-close" id="drawerClose">✕</button>
  <a href="index.html">Home</a>
  <a href="products.html">All Products</a>
  <a href="offers.html">Offers</a>
  <a href="contact.html">Contact</a>
</nav>

<div class="page-hero"><div class="container"><h1>Your Cart</h1></div></div>

<div class="container" style="padding:36px 20px">
  <div style="display:grid;grid-template-columns:2fr 1fr;gap:30px" id="cartLayout">
    <div id="cartList"></div>
    <div class="cart-summary">
      <div class="row"><span>Subtotal</span><span id="subtotal">৳0</span></div>
      <div class="row"><span>Delivery Fee</span><span id="deliveryFee">Calculated at checkout</span></div>
      <div class="row total"><span>Total</span><span id="grandTotal">৳0</span></div>
      <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:16px">Proceed to Checkout</a>
      <a href="products.html" class="btn btn-outline btn-block" style="margin-top:10px;border-color:var(--primary);color:var(--primary)">Continue Shopping</a>
    </div>
  </div>
</div>

<footer id="siteFooter"></footer>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="store.js"></script>
<script src="site.js"></script>
<script>
  function renderCart() {
    const cart = getCart();
    const listEl = document.getElementById("cartList");
    if (!cart.length) {
      listEl.innerHTML = `<div class="empty-state"><h3>Your cart is empty</h3><p>Add products to start shopping</p><a href="products.html" class="btn btn-primary" style="margin-top:14px">Browse Products</a></div>`;
      document.getElementById("subtotal").textContent = document.getElementById("grandTotal").textContent = formatTaka(0);
      return;
    }
    listEl.innerHTML = cart.map((c, i) => `
      <div class="cart-row">
        <img src="${c.image}" alt="${c.name}">
        <div class="info">
          <div style="font-weight:600">${c.name}</div>
          <div class="meta">Size: ${c.size} · Colour: ${c.color} · Qty: ${c.qty}</div>
          <div style="color:var(--primary);font-weight:700;margin-top:4px">${formatTaka(c.price * c.qty)}</div>
        </div>
        <button class="remove" data-i="${i}" aria-label="Remove">🗑️</button>
      </div>
    `).join("");
    document.querySelectorAll(".remove").forEach(b => b.addEventListener("click", () => {
      const c = getCart(); c.splice(Number(b.dataset.i), 1); saveCart(c); renderCart();
    }));
    const subtotal = cart.reduce((s, c) => s + c.price * c.qty, 0);
    document.getElementById("subtotal").textContent = formatTaka(subtotal);
    document.getElementById("grandTotal").textContent = formatTaka(subtotal);
  }
  NurevaStore.ready.then(() => { applySettings(); renderFooter(); renderCart(); });
</script>
</body>
</html>
