<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — Nureva Fashion Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=36">
<link rel="stylesheet" href="admin.css?v=36">
</head>
<body class="admin-body">

<div class="admin-app">
  <div class="admin-sidebar-overlay" id="adminSidebarOverlay"></div>
  <aside class="admin-sidebar">
    <button class="admin-sidebar-close" id="adminSidebarClose">✕</button>
    <div class="admin-logo">Nureva <span>Fashion</span><small>Admin Panel</small></div>
    <nav class="admin-nav">
      <a href="admin-dashboard.html">📊 Dashboard</a>
      <a href="admin-products.html">👗 Products</a>
      <a href="admin-banners.html">🖼️ Covers</a>
      <a href="admin-news.html">📢 News / Notice</a>
      <a href="admin-orders.html">📦 Orders</a>
      <a href="admin-chat.html">💬 Live Chat<span class="nav-badge" id="navChatBadge">0</span></a>
      <a href="admin-settings.html">⚙️ Settings</a>
    </nav>
    <a href="index.html" target="_blank" class="admin-view-site">🔗 View Site</a>
    <button id="logoutBtn" class="admin-logout">🚪 Logout</button>
  </aside>

  <main class="admin-main">
    <button class="admin-mobile-toggle" id="adminMobileToggle">☰ Menu</button>
    <section class="admin-panel">
      <div class="admin-panel-head">
        <h2>Product Management</h2>
        <button class="btn btn-primary" id="newProductBtn">+ New Product</button>
      </div>
      <div class="filter-bar" id="productFilterBar"></div>
      <div class="admin-table-wrap">
        <table class="admin-table" id="productTable"></table>
      </div>
    </section>
  </main>
</div>

<!-- Product edit modal -->
<div class="modal-overlay" id="productModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">New Product</h3>
      <button id="modalClose">✕</button>
    </div>
    <form id="productForm">
      <input type="hidden" id="pId">
      <div class="form-row">
        <div class="form-group"><label>Product Name *</label><input type="text" id="pName" required></div>
        <div class="form-group"><label>Category *</label>
          <select id="pCategory" required></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Price (৳) *</label><input type="number" id="pPrice" required></div>
        <div class="form-group"><label>Offer Price (৳) — optional</label><input type="number" id="pOfferPrice"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Stock Quantity</label><input type="number" id="pStock" value="10"></div>
        <div class="form-group"><label>Sizes (comma separated)</label><input type="text" id="pSizes" value="S, M, L, XL"></div>
      </div>
      <div class="form-group"><label>Colours (comma separated)</label><input type="text" id="pColors" value="Black, Navy Blue"></div>
      <div class="form-group"><label>Description</label><textarea id="pDescription"></textarea></div>
      <div class="form-group">
        <label>Images (multiple allowed)</label>
        <input type="file" id="pImages" accept="image/*" multiple>
        <div class="admin-thumb-row" id="pImagePreview"></div>
      </div>
      <div class="form-row">
        <label class="chip" style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="pIsNew"> Show as New Arrival</label>
        <label class="chip" style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="pIsFeatured"> Show in Popular Picks</label>
      </div>
      <div style="display:flex;gap:12px;margin-top:10px">
        <button type="submit" class="btn btn-primary" style="flex:1">Save</button>
        <button type="button" class="btn btn-outline" id="modalCancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
  /* Self-healing: mobile networks sometimes drop one of these CDN/script
     requests mid-load. If that happens NurevaStore never gets created and
     everything relying on it (Call/WhatsApp, products, etc.) silently
     fails. Auto-reload once (only once, via sessionStorage guard) so a
     transient network blip fixes itself instead of leaving a broken page. */
  function nurevaRetryLoad() {
    var key = "nurevaReloadCount";
    var n = parseInt(sessionStorage.getItem(key) || "0", 10);
    if (n < 2) { sessionStorage.setItem(key, String(n + 1)); location.reload(); }
  }
</script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="firebase-config.js?v=36" onerror="nurevaRetryLoad()"></script>
<script src="store.js?v=36" onerror="nurevaRetryLoad()"></script>
<script src="admin.js?v=36"></script>
</body>
</html>
