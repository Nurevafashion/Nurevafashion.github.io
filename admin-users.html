<!DOCTYPE html>

<head>

<style>
  .user-card { background:var(--white); border-radius:var(--radius); padding:16px 18px; box-shadow:0 6px 20px rgba(198,0,126,0.08); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:14px; cursor:pointer; transition:box-shadow 0.15s; }
  .user-card:hover { box-shadow:0 6px 20px rgba(198,0,126,0.2); }
  .user-card .u-main strong { font-size:1rem; }
  .user-card .u-main .u-sub { color:#8A5875; font-size:0.85rem; margin-top:2px; }
  .user-card .u-badges { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .u-badge { font-size:0.78rem; font-weight:600; padding:5px 10px; border-radius:20px; white-space:nowrap; }
  .u-badge.spent { background:#E8F6EC; color:#1E7B3A; }
  .u-badge.orders { background:var(--admin-pink-soft); color:var(--admin-pink-dark); }
  .u-badge.cancel { background:#FFE9EC; color:#C0143C; }
  .user-search { margin-bottom:16px; }
  .user-search input { width:100%; box-sizing:border-box; padding:11px 14px; border-radius:var(--radius); border:1.5px solid rgba(0,0,0,0.12); font-size:0.92rem; }
  .detail-row { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid rgba(0,0,0,0.06); font-size:0.92rem; }
  .detail-row:last-child { border-bottom:none; }
  .detail-row span:first-child { color:#8A5875; }
  .detail-row span:last-child { font-weight:600; text-align:right; }
  .detail-stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; }
  .detail-stats .stat-card { padding:14px; }
  .detail-order-item { background:#FAF7F5; border-radius:var(--radius); padding:10px 12px; margin-bottom:8px; font-size:0.85rem; }
  .detail-order-item .doi-head { display:flex; justify-content:space-between; font-weight:600; }
  #userModal .modal-box { max-width: 620px; max-height: 86vh; overflow-y: auto; }
</style>
</head>
<body class="admin-body">

<div class="admin-app">
  <div class="admin-sidebar-overlay" id="adminSidebarOverlay"></div>
  <aside class="admin-sidebar">
    <button class="admin-sidebar-close" id="adminSidebarClose">✕</button>
    <div class="admin-logo">Nureva <span>Fashion</span><small>Admin Panel</small></div>
    <nav class="admin-nav">
      <a href="admin-dashboard.html">📊 Dashboard</a>
      <a href="admin-products.html">👗 Products</a>
      <a href="admin-banners.html">🖼️ Covers</a>
      <a href="admin-news.html">📢 News / Notice</a>
      <a href="admin-orders.html">📦 Orders</a>
      <a href="admin-users.html">👤 Account Users</a>
      <a href="admin-chat.html">💬 Live Chat<span class="nav-badge" id="navChatBadge">0</span></a>
      <a href="admin-settings.html">⚙️ Settings</a>
    </nav>
    <a href="index.html" target="_blank" class="admin-view-site">🔗 View Site</a>
    <button id="logoutBtn" class="admin-logout">🚪 Logout</button>
  </aside>

  <main class="admin-main">
    <button class="admin-mobile-toggle" id="adminMobileToggle">☰ Menu</button>
    <section class="admin-panel">
      <h2>Account Users</h2>
      <div class="stat-grid" id="userStatGrid" style="margin-bottom:20px"></div>
      <div class="user-search"><input type="text" id="userSearch" placeholder="Search by name, phone or email..."></div>
      <div id="usersList"></div>
    </section>
  </main>
</div>

<!-- User detail modal -->
<div class="modal-overlay" id="userModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="umName">—</h3>
      <button id="umClose">✕</button>
    </div>
    <div id="umBody"></div>
  </div>
</div>

<script>
  /* Self-healing: mobile networks sometimes drop one of these CDN/script
     requests mid-load. If that happens NurevaStore never gets created and
     everything relying on it (Call/WhatsApp, products, etc.) silently
     fails. Auto-reload once (only once, via sessionStorage guard) so a
     transient network blip fixes itself instead of leaving a broken page. */
  function nurevaRetryLoad() {
    var key = "nurevaReloadCount";
    var n = parseInt(sessionStorage.getItem(key) || "0", 10);
    if (n < 2) { sessionStorage.setItem(key, String(n + 1)); location.reload(); }
  }
</script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="firebase-config.js?v=55" onerror="nurevaRetryLoad()"></script>
<script src="store.js?v=55" onerror="nurevaRetryLoad()"></script>
<script src="admin.js?v=55"></script>
</body>
</html>
