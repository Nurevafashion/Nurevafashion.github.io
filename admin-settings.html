<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Nureva Fashion Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=51">
<link rel="stylesheet" href="admin.css?v=51">
</head>
<body class="admin-body">

<div class="admin-app">
  <div class="admin-sidebar-overlay" id="adminSidebarOverlay"></div>
  <aside class="admin-sidebar">
    <button class="admin-sidebar-close" id="adminSidebarClose">✕</button>
    <div class="admin-logo">Nureva <span>Fashion</span><small>Admin Panel</small></div>
    <nav class="admin-nav">
      <a href="admin-dashboard.html">📊 Dashboard</a>
      <a href="admin-products.html">👗 Products</a>
      <a href="admin-banners.html">🖼️ Covers</a>
      <a href="admin-news.html">📢 News / Notice</a>
      <a href="admin-orders.html">📦 Orders</a>
      <a href="admin-users.html">👤 Account Users</a>
      <a href="admin-chat.html">💬 Live Chat<span class="nav-badge" id="navChatBadge">0</span></a>
      <a href="admin-settings.html">⚙️ Settings</a>
    </nav>
    <a href="index.html" target="_blank" class="admin-view-site">🔗 View Site</a>
    <button id="logoutBtn" class="admin-logout">🚪 Logout</button>
  </aside>

  <main class="admin-main">
    <button class="admin-mobile-toggle" id="adminMobileToggle">☰ Menu</button>
    <section class="admin-panel">
      <h2>Site Settings</h2>
      <div class="admin-card">
        <form id="settingsForm">
          <div class="form-row">
            <div class="form-group"><label>Site Name</label><input type="text" id="setSiteName"></div>
            <div class="form-group"><label>Tagline</label><input type="text" id="setTagline"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Facebook Page Link</label><input type="text" id="setFacebook" placeholder="https://facebook.com/Nurevafashion"></div>
            <div class="form-group"><label>Instagram Link</label><input type="text" id="setInstagram" placeholder="https://instagram.com/nurevafashion"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Facebook Messenger Link</label><input type="text" id="setMessenger" placeholder="https://m.me/nurevafashion"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Phone Number</label><input type="text" id="setPhone"></div>
            <div class="form-group"><label>WhatsApp Number (with country code, no +)</label><input type="text" id="setWhatsapp" placeholder="8801XXXXXXXXX"></div>
          </div>
          <div class="form-group"><label>Address</label><input type="text" id="setAddress"></div>
          <div class="form-row">
            <div class="form-group"><label>Delivery Fee — Inside Dhaka (৳)</label><input type="number" id="setDeliveryIn"></div>
            <div class="form-group"><label>Delivery Fee — Outside Dhaka (৳)</label><input type="number" id="setDeliveryOut"></div>
          </div>
          <button class="btn btn-primary" type="submit">Save Changes</button>
        </form>
      </div>
      <div class="admin-card">
        <h3>Change Admin Password</h3>
        <form id="passwordForm" class="admin-inline-form">
          <input type="password" id="newPassword" placeholder="New password" required minlength="6">
          <button class="btn btn-primary" type="submit">Change</button>
        </form>
      </div>
    </section>
  </main>
</div>

<script>
  /* Self-healing: mobile networks sometimes drop one of these CDN/script
     requests mid-load. If that happens NurevaStore never gets created and
     everything relying on it (Call/WhatsApp, products, etc.) silently
     fails. Auto-reload once (only once, via sessionStorage guard) so a
     transient network blip fixes itself instead of leaving a broken page. */
  function nurevaRetryLoad() {
    var key = "nurevaReloadCount";
    var n = parseInt(sessionStorage.getItem(key) || "0", 10);
    if (n < 2) { sessionStorage.setItem(key, String(n + 1)); location.reload(); }
  }
</script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js" onerror="nurevaRetryLoad()"></script>
<script src="firebase-config.js?v=51" onerror="nurevaRetryLoad()"></script>
<script src="store.js?v=51" onerror="nurevaRetryLoad()"></script>
<script src="admin.js?v=51"></script>
</body>
</html>
