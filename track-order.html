<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order — Nureva Fashion</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=7">
<style>
  .track-wrap { max-width: 480px; margin: 0 auto; padding: 36px 20px 60px; box-sizing: border-box; }
  .track-form { display: flex; gap: 10px; margin-bottom: 26px; }
  .track-form input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid rgba(59,31,50,0.25); border-radius: var(--radius); font-size: 0.95rem; box-sizing: border-box; }
  .order-card { background: var(--white); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }
  .order-card .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem; }
  .order-card .oid { font-weight: 700; color: var(--primary); font-family: var(--font-display); }
  .order-card .items { color: var(--mauve); font-size: 0.85rem; margin: 8px 0; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner container">
    <a href="index.html" class="logo"><img src="logo.png" alt="Nureva Fashion" class="logo-img"><span class="logo-text">Nureva <span>Fashion</span></span></a>
    <nav class="main-nav">
          <a href="products.html">All Products</a>
      <a href="products.html?filter=new">New Arrivals</a>
      <a href="offers.html">Offers</a>
      <a href="track-order.html">My Orders</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn icon-btn-round" id="searchToggle" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div class="search-panel" id="searchPanel">
    <div class="container">
      <input type="text" id="searchInput" placeholder="Search products...">
      <button id="searchGo">Search</button>
    </div>
    <div id="searchResults"></div>
  </div>
</header>

<div class="drawer-overlay" id="drawerOverlay"></div>
<nav class="nav-drawer" id="navDrawer">
  <button class="drawer-close" id="drawerClose">✕</button>
  <a href="products.html">All Products</a>
  <a href="products.html?filter=new">New Arrivals</a>
  <a href="offers.html">Offers</a>
  <a href="products.html?cat=Burqa">Burqa</a>
  <a href="products.html?cat=Three-Piece">Three-Piece</a>
  <a href="products.html?cat=Hijab">Hijab</a>
  <a href="products.html?cat=Panjabi">Panjabi</a>
  <a href="track-order.html">My Orders</a>
      <a href="contact.html">Contact</a>
  <a data-fb-link href="#" target="_blank" rel="noopener">Facebook Page</a>
</nav>

<div class="page-hero">
  <div class="container">
    <h1>Track Your Order</h1>
    <p>Enter the mobile number you used at checkout</p>
  </div>
</div>

<div class="track-wrap">
  <form class="track-form" id="trackForm">
    <input type="tel" id="trackPhone" placeholder="e.g. 01XXXXXXXXX" required>
    <button class="btn btn-primary btn-sm" type="submit" style="flex-shrink:0;white-space:nowrap">Track</button>
  </form>
  <div id="trackResults"></div>
</div>

<div class="topbar">Cash on Delivery Nationwide &nbsp;•&nbsp; Order via Facebook or our website</div>

<footer id="siteFooter"></footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=7"></script>
<script src="store.js?v=7"></script>
<script src="site.js?v=7"></script>
<script>
  NurevaStore.ready.then(() => { applySettings(); renderFooter(); });

  document.getElementById("trackForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const phone = document.getElementById("trackPhone").value.trim();
    const results = NurevaStore.Orders.byPhone(phone);
    const el = document.getElementById("trackResults");
    if (!results.length) {
      el.innerHTML = `<div class="empty-state"><h3>No orders found</h3><p>No order was found for this number. Please check the number and try again.</p></div>`;
      return;
    }
    el.innerHTML = results.map(o => `
      <div class="order-card">
        <div class="row"><span class="oid">${o.id}</span><span class="tag status" style="background:rgba(60,107,74,0.12);color:var(--success);padding:3px 10px;border-radius:10px;font-size:0.75rem;font-weight:700">${o.status}</span></div>
        <div class="row"><span>Order Date</span><span>${new Date(o.date).toLocaleDateString()}</span></div>
        <div class="items">${o.items.map(i => i.name + " ×" + i.qty).join(", ")}</div>
        <div class="row"><strong>Total</strong><strong>${formatTaka(o.total)}</strong></div>
      </div>
    `).join("");
  });
</script>
</body>
</html>
