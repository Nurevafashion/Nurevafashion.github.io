      </button>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>

  <a href="offers.html">Offers</a>

  <a href="products.html?cat=Hijab">Hijab</a>

<div class="container">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div class="pd-wrap" id="pdWrap"></div>
</div>

<div class="container"><div class="stitch"></div></div>

<section>
  <div class="container">
    <div class="section-head">
      <h2>You Might Also Like</h2>
    </div>
    <div class="product-grid" id="relatedGrid"></div>
  </div>
</section>

<div class="topbar">Cash on Delivery Nationwide &nbsp;•&nbsp; Order via Facebook or our website</div>

<footer id="siteFooter"></footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=33"></script>
<script src="store.js?v=33"></script>
<script src="site.js?v=33"></script>
<script>
  let selSize, selColor, qty = 1, currentProduct = null;

  function renderProductPage() {
    applySettings();
    const id = new URLSearchParams(location.search).get("id");
    const p = NurevaStore.Products.get(id);
    const pdWrap = document.getElementById("pdWrap");

    if (!p) {
      pdWrap.innerHTML = `<div class="empty-state"><h3>Product not found</h3><p><a href="products.html" class="btn btn-primary" style="margin-top:14px">Browse All Products</a></p></div>`;
      renderFooter();
      return;
    }
    currentProduct = p;
    document.getElementById("pageTitleTag").textContent = p.name + " — Nureva Fashion";
    document.getElementById("breadcrumb").innerHTML =
      ` / <a href="products.html?cat=${encodeURIComponent(p.category)}">${p.category}</a> / ${p.name}`;

    const offer = !!p.offerPrice;
    if (!selSize || !p.sizes.includes(selSize)) selSize = p.sizes[0];
    if (!selColor || !p.colors.includes(selColor)) selColor = p.colors[0];

    pdWrap.innerHTML = `
      <div class="pd-gallery">
        <div class="pd-gallery-main"><img id="mainImg" src="${p.images[0]}" alt="${p.name}" style="cursor:zoom-in"></div>
        <div class="pd-thumbs">
          ${p.images.map((img, i) => `<img src="${img}" class="${i === 0 ? "active" : ""}" data-i="${i}">`).join("")}
        </div>
      </div>
      <div class="pd-info">
        <div class="pd-cat">${p.category}</div>
        <h1>${p.name}</h1>
        <div class="pd-price">
          <span class="price-now">${formatTaka(offer ? p.offerPrice : p.price)}</span>
          ${offer ? `<span class="price-old">${formatTaka(p.price)}</span>` : ""}
        </div>
        <div class="pd-stock ${p.stock < 5 ? "low" : ""}">${p.stock > 0 ? `In stock (${p.stock} available)` : "Out of stock"}</div>

        <div class="option-group">
          <label>Choose Size</label>
          <div class="chip-row" id="sizeChips">
            ${p.sizes.map((s, i) => `<button class="chip ${s === selSize ? "selected" : ""}" data-size="${s}">${s}</button>`).join("")}
          </div>
        </div>
        <div class="option-group">
          <label>Choose Colour</label>
          <div class="chip-row" id="colorChips">
            ${p.colors.map((c, i) => `<button class="chip ${c === selColor ? "selected" : ""}" data-color="${c}">${c}</button>`).join("")}
          </div>
        </div>
        <div class="option-group">
          <label>Quantity</label>
          <div class="qty-row">
            <button id="qtyMinus">−</button>
            <span id="qtyVal">${qty}</span>
            <button id="qtyPlus">+</button>
          </div>
        </div>

        <div class="pd-actions">
          <button class="btn btn-outline" style="border-color:var(--primary);color:var(--primary)" id="addCartBtn">Add to Cart</button>
          <a class="btn btn-primary" id="buyNowBtn" href="checkout.html">Buy Now</a>
        </div>
        <a class="btn btn-gold btn-block" id="waBtn" href="#" target="_blank" rel="noopener" style="margin-bottom:26px">📱 Order via WhatsApp</a>

        <div class="pd-desc">
          <h4>Description</h4>
          <p>${p.description}</p>
        </div>
      </div>
    `;

    document.querySelectorAll(".pd-thumbs img").forEach(t => t.addEventListener("click", () => {
      document.getElementById("mainImg").src = t.src;
      document.querySelectorAll(".pd-thumbs img").forEach(x => x.classList.remove("active"));
      t.classList.add("active");
    }));
    document.getElementById("mainImg").addEventListener("click", () => openLightbox(document.getElementById("mainImg").src));
    document.querySelectorAll("#sizeChips .chip").forEach(c => c.addEventListener("click", () => {
      document.querySelectorAll("#sizeChips .chip").forEach(x => x.classList.remove("selected"));
      c.classList.add("selected"); selSize = c.dataset.size;
    }));
    document.querySelectorAll("#colorChips .chip").forEach(c => c.addEventListener("click", () => {
      document.querySelectorAll("#colorChips .chip").forEach(x => x.classList.remove("selected"));
      c.classList.add("selected"); selColor = c.dataset.color;
    }));
    document.getElementById("qtyMinus").addEventListener("click", () => { if (qty > 1) qty--; document.getElementById("qtyVal").textContent = qty; });
    document.getElementById("qtyPlus").addEventListener("click", () => { qty++; document.getElementById("qtyVal").textContent = qty; });

    function cartItem() {
      return { productId: p.id, name: p.name, image: p.images[0], price: offer ? p.offerPrice : p.price, size: selSize, color: selColor, qty };
    }
    document.getElementById("addCartBtn").addEventListener("click", () => addToCart(cartItem()));
    document.getElementById("buyNowBtn").addEventListener("click", (e) => {
      e.preventDefault();
      addToCart(cartItem());
      location.href = "checkout.html";
    });

    const settings = NurevaStore.Settings.get();
    document.getElementById("waBtn").href = settings.whatsapp
      ? `https://wa.me/${settings.whatsapp}?text=${encodeURIComponent("I would like to order: " + p.name + " (Size: " + selSize + ", Colour: " + selColor + ")")}`
      : (settings.facebook || "#");

    renderProductGrid("relatedGrid", NurevaStore.Products.byCategory(p.category).filter(x => x.id !== p.id).slice(0, 4), "");
    renderFooter();
  }

  NurevaStore.ready.then(renderProductPage);
  NurevaStore.onChange(renderProductPage);
</script>
</body>
</html>
