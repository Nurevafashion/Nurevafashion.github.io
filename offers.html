    <nav class="main-nav">
      <a href="index.html">Home</a>

      <a href="products.html?filter=new">New Arrivals</a>

    <div class="header-actions">

  </div>
</div>

<div class="container">
  <section>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="store.js"></script>
<script src="site.js"></script>
<script>
  function renderOffersPage() {
    applySettings();
    renderProductGrid("offerGrid", NurevaStore.Products.onOffer(), "No offers running right now. New offers coming soon!");
    renderFooter();
  }
  NurevaStore.ready.then(renderOffersPage);
  NurevaStore.onChange(renderOffersPage);
</script>
